[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeagent"
version = "0.1.0"
description = "Autonomous Software Engineering inside Antigravity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "ForgeAgent Engineering Team", email = "engineering@forgeagent.local" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0"
]

[project.scripts]
forge = "forgeagent.cli.main:cli"

[project.entry-points."antigravity.plugins"]
forgeagent = "forgeagent.antigravity.sdk_bridge:AntigravitySDKBridge"
